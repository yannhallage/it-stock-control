# CircleCI : vérifications, build Docker du frontend et publication sur GHCR + Docker Hub.
#
# Variables à définir dans CircleCI (Project Settings → Environment Variables) :
#   GHCR_USERNAME     — compte GitHub qui pousse
#   GHCR_TOKEN        — PAT GitHub avec write:packages (et repo si le dépôt est privé)
#   DOCKER_USERNAME   — identifiant Docker Hub
#   DOCKER_PASSWORD   — mot de passe ou Access Token Docker Hub
#
# Images :
#   ghcr.io/<owner-github>/assets-managment-control:latest et :sha-<7 caractères>
#   <DOCKER_USERNAME>/assets-managment-control:latest et :sha-<7 caractères>

version: 2.1

orbs:
  node: circleci/node@7

executors:
  node:
    docker:
      - image: cimg/node:20.19

jobs:
  verify:
    executor: node
    steps:
      - checkout

      - run:
          name: Lint Dockerfile
          command: |
            curl -sL -o hadolint "https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64"
            chmod +x hadolint
            sudo mv hadolint /usr/local/bin/hadolint
            hadolint Dockerfile

      - node/install-packages:
          pkg-manager: npm

      - run:
          name: Lint
          command: npm run lint

  build-and-push:
    docker:
      - image: cimg/base:current
    resource_class: medium
    environment:
      GHCR_REGISTRY: ghcr.io
      IMAGE_REPO: assets-managment-control
    steps:
      - checkout
      - setup_remote_docker

      - run:
          name: Login to GitHub Container Registry
          command: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin

      - run:
          name: Login to Docker Hub
          command: echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin

      - run:
          name: Build and push Docker image
          no_output_timeout: 20m
          command: |
            OWNER="$(echo "${CIRCLE_PROJECT_USERNAME}" | tr '[:upper:]' '[:lower:]')"
            TAG="sha-$(echo "${CIRCLE_SHA1}" | cut -c1-7)"
            GHCR_IMAGE="${GHCR_REGISTRY}/${OWNER}/${IMAGE_REPO}"
            HUB_IMAGE="${DOCKER_USERNAME}/${IMAGE_REPO}"
            echo "GHCR_IMAGE=${GHCR_IMAGE}" >> "$BASH_ENV"
            docker build \
              --label org.opencontainers.image.revision="${CIRCLE_SHA1}" \
              --label org.opencontainers.image.source="${CIRCLE_REPOSITORY_URL}" \
              -t "${GHCR_IMAGE}:latest" \
              -t "${GHCR_IMAGE}:${TAG}" \
              -t "${HUB_IMAGE}:latest" \
              -t "${HUB_IMAGE}:${TAG}" \
              .
            docker push "${GHCR_IMAGE}:latest"
            docker push "${GHCR_IMAGE}:${TAG}"
            docker push "${HUB_IMAGE}:latest"
            docker push "${HUB_IMAGE}:${TAG}"

      - run:
          name: Install Trivy
          command: |
            curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
              | sh -s -- -b /tmp v0.69.3

      - run:
          name: Scan image with Trivy
          command: |
            export TRIVY_USERNAME="$GHCR_USERNAME"
            export TRIVY_PASSWORD="$GHCR_TOKEN"
            /tmp/trivy image --exit-code 0 --format table --vuln-type os,library "${GHCR_IMAGE}:latest"

workflows:
  oraclouds:
    jobs:
      - verify:
          filters:
            branches:
              only: oraclouds
      - build-and-push:
          requires:
            - verify
          filters:
            branches:
              only: oraclouds
