# CI : vérifications, build de l'image Docker du frontend et publication sur GHCR.
name: oraclouds

# Déclenché uniquement sur la branche de livraison.
on:
  push:
    branches: [oraclouds]

# Lecture du dépôt + écriture des packages (nécessaire pour pousser sur GHCR).
permissions:
  contents: read
  packages: write

# Évite les courses : un nouveau push sur la même branche annule le run précédent.
concurrency:
  group: oraclouds-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/it-stock-control

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Bonnes pratiques Dockerfile (anti-patterns, sécurité de base).
      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

      # Même version majeure que dans le Dockerfile (node:20-alpine).
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # Install reproductible ; doit correspondre au package-lock.json.
      - name: Install dependencies
        run: npm ci

      # Échec rapide avant Docker si le code ne respecte pas ESLint.
      - name: Lint
        run: npm run lint

      # Buildx : cache GHA et builds plus avancés que le docker build classique.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Génère les tags (latest + sha du commit) et les labels OCI standard.
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha

      # Image multi-couches avec cache entre les runs (accélère les builds suivants).
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Binaire Trivy via setup-trivy v0.2.6 (version recommandée) ; trivy-action saute son install interne.
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.2.6
        with:
          version: v0.69.3
          cache: true

      # Scan de vulnérabilités sur l'image poussée ; exit-code 0 = informatif seulement.
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          skip-setup-trivy: "true"
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          exit-code: "0"
          format: table
          vuln-type: os,library
